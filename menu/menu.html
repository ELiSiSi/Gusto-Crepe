<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="../image/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="menu.css" />
  <link rel="stylesheet" href="nornalize.css" />

  <!-- Google Fonts: Cairo & Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <!--start header-->
  <!--start header-->
  <!--start header-->

      </div>
      <div class="name">
        <h1><span>Gusto Crepe</span></h1>
      </div>
      <a href="../index.html" class="btn-back-home">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </a>
    </div>
  </div>

  <!-- The menu title -->
  <div class="title">
    <div class="container">
      <div class="text">The Menu</div>
      <div>
        <p>قائمة طعام جوستو كريب • اضغط على أي صفحة لتكبيرها</p>
      </div>
    </div>
  </div>

  <!-- start menu -->
  <!-- start menu -->
  <!-- start menu -->
  <div class="menu">
    <div class="container">
      
      <div class="menu-item" onclick="openLightbox(0)">
        <span class="menu-page-badge">صفحة 1</span>
        <img src="image/1 (1).jpeg" alt="Gusto Crepe Menu 1" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

      <div class="menu-item" onclick="openLightbox(1)">
        <span class="menu-page-badge">صفحة 2</span>
        <img src="image/1 (2).jpeg" alt="Gusto Crepe Menu 2" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

      <div class="menu-item" onclick="openLightbox(2)">
        <span class="menu-page-badge">صفحة 3</span>
        <img src="image/1 (3).jpeg" alt="Gusto Crepe Menu 3" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

      <div class="menu-item" onclick="openLightbox(3)">
        <span class="menu-page-badge">صفحة 4</span>
        <img src="image/1 (4).jpeg" alt="Gusto Crepe Menu 4" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

      <div class="menu-item" onclick="openLightbox(4)">
        <span class="menu-page-badge">صفحة 5</span>
        <img src="image/1 (5).jpeg" alt="Gusto Crepe Menu 5" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

      <div class="menu-item" onclick="openLightbox(5)">
        <span class="menu-page-badge">صفحة 6</span>
        <img src="image/1 (6).jpeg" alt="Gusto Crepe Menu 6" />
        <span class="menu-zoom-badge"><i class="fa-solid fa-magnifying-glass-plus"></i> اضغط للتكبير</span>
      </div>

    </div>
  </div>

  <!-- Lightbox Modal (Zoom Feature) -->
  <div class="lightbox" id="lightbox" onclick="closeLightboxOnBackdrop(event)">
    <div class="lightbox-content">
      <button class="lightbox-close" onclick="closeLightbox()" title="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="lightbox-nav lightbox-prev" onclick="prevImage(event)" title="الصفحة السابقة">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <img src="" alt="Menu preview" class="lightbox-img" id="lightboxImg" />
      <button class="lightbox-nav lightbox-next" onclick="nextImage(event)" title="الصفحة التالية">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </div>
  </div>

  <!--start container order-->
  <div class="container order-section">
    <form>
      <div class="text">لطلب اوردر </div>
      <a href="https://wa.me/201005599818" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
        <span>اضغط هناااا</span>
      </a>
    </form>
  </div>

  <script>
    const images = [
      'image/1 (1).jpeg',
      'image/1 (2).jpeg',
      'image/1 (3).jpeg',
      'image/1 (4).jpeg',
      'image/1 (5).jpeg',
      'image/1 (6).jpeg'
    ];
    let currentIndex = 0;

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = images[currentIndex];
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function closeLightboxOnBackdrop(e) {
      if (e.target === lightbox) {
        closeLightbox();
      }
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex];
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex];
    }

    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') prevImage();
      if (e.key === 'ArrowLeft') nextImage();
    });
  </script>
</body>
</html>
